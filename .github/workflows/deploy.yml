name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Отменять уже начатую публикацию нельзя: Pages остаётся с недоделанным
# деплоем, и следующий запуск висит до таймаута. Ставим в очередь.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Таймаут ожидания Pages поднять нельзя: 600000 мс — жёсткий потолок
      # самого действия. Значит единственный рычаг — вес артефакта.
      - id: deployment
        uses: actions/deploy-pages@v4
